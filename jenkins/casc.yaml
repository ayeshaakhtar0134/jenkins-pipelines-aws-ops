jenkins:
  systemMessage: "AWS ops Jenkins. Configured as code, do not edit in the UI."
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID:-admin}"
            permissions: ["Overall/Administer"]
        - group:
            name: "authenticated"
            permissions: ["Overall/Read", "Job/Read", "Job/Build"]

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"
  # Shared library loaded from this same repo (vars/)
  globalLibraries:
    libraries:
      - name: "ops-lib"
        defaultVersion: "main"
        implicit: false
        retriever:
          modernSCM:
            scm:
              git:
                remote: "${OPS_REPO_URL:-https://github.com/ayeshaakhtar0134/jenkins-pipelines-aws-ops.git}"
  slackNotifier:
    teamDomain: "${SLACK_WORKSPACE:-}"
    tokenCredentialId: "slack-token"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "slack-token"
              description: "Slack bot token"
              secret: "${SLACK_TOKEN:-not-set}"

# One seed job creates every pipeline from jobs/seed.groovy
jobs:
  - script: >
      job('seed') {
        description('Creates all ops pipelines from jobs/seed.groovy')
        scm {
          git {
            remote { url(System.getenv('OPS_REPO_URL') ?: 'https://github.com/ayeshaakhtar0134/jenkins-pipelines-aws-ops.git') }
            branch('*/main')
          }
        }
        triggers { cron('H/30 * * * *') }
        steps {
          dsl {
            external('jobs/seed.groovy')
            removeAction('DELETE')
          }
        }
      }
